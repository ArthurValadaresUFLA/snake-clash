# Instalação:
#   pip install pre-commit   (ou: pipx install pre-commit)
#   pre-commit install
# Ferramentas locais necessárias no PATH: fourmolu, hlint e cabal.
default_install_hook_types: [pre-commit, commit-msg]
minimum_pre_commit_version: "3.2.0"

repos:
  # ---------- Higiene geral ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-illegal-windows-names
      - id: check-symlinks
      - id: destroyed-symlinks
      # O projeto não usa submódulos; evita adicioná-los por engano.
      - id: forbid-new-submodules

  # ---------- Markdown ----------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # ---------- Commits convencionais ----------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # ---------- Haskell ----------
  - repo: local
    hooks:
      - id: fourmolu
        name: fourmolu (formatação Haskell)
        entry: fourmolu --mode inplace
        language: system
        files: '\.hs$'
        types: [file]

      - id: hlint
        name: hlint
        entry: hlint
        language: system
        files: '\.hs$'
        types: [file]

      # O pacote não é publicado no Hackage; ignora apenas as checagens
      # de metadados/distribuição que não se aplicam a este projeto.
      - id: cabal-check
        name: cabal check
        entry: cabal check
        args:
          - --ignore=no-repository
          - --ignore=no-category
          - --ignore=no-maintainer
          - --ignore=no-description
          - --ignore=missing-upper-bounds
          - --ignore=license-none
          - --ignore=missing-bounds-important
        language: system
        files: '\.cabal$'
        pass_filenames: false

      # Bloqueia artefatos gerados, caso escapem do .gitignore.
      - id: no-build-artifacts
        name: bloquear artefatos de build
        entry: >-
          bash -c 'if git diff --cached --name-only --diff-filter=ACMR | grep -Eq "\.(hi|o|dyn_hi|dyn_o|prof|eventlog|sof|pof|rbf|jic|qws|qdf|rpt|summary|smsg|done|jdi|pin|vcd|fst|ghw|wlf|ucdb|vstf)$|(^|/)(dist-newstyle|build|verilog-out|vhdl-out|systemverilog-out|output_files|db|incremental_db|qdb|greybox_tmp|tmp-clearbox|work|obj_dir|_build)/|\.topEntity/"; then
          echo "Artefatos de build detectados no commit."; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
